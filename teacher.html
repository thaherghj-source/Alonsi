<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم | النظام المدرسي المتكامل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- رأس الصفحة (Header) -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-800 border border-indigo-700 flex items-center justify-center shadow-inner">
                    <i data-lucide="graduation-cap" class="w-6 h-6 text-indigo-300"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight" id="headerTeacherName">جاري التحميل...</h1>
                    <span class="text-xs text-indigo-300 font-medium" id="headerTeacherRole">معلم المادة</span>
                </div>
            </div>
            <button onclick="logout()" class="flex items-center gap-2 px-3.5 py-2 bg-red-600/20 hover:bg-red-600 text-red-200 hover:text-white rounded-xl text-xs font-bold transition border border-red-500/30">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                تسجيل الخروج
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- بطاقات الملخص والإحصاءات -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-semibold">المبحث / التخصص</span>
                    <span class="text-sm font-bold text-slate-800" id="profileSubject">-</span>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                    <i data-lucide="award" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-semibold">المؤهل الأكاديمي</span>
                    <span class="text-xs font-bold text-slate-800" id="profileMajor">-</span>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-semibold">نصاب الحصص الأسبوعي</span>
                    <span class="text-base font-bold text-slate-800" id="profileQuota">-</span>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-semibold">الصفوف المسندة</span>
                    <span class="text-base font-bold text-slate-800" id="profileClassesCount">-</span>
                </div>
            </div>
        </div>

        <!-- جدول الحصص الأسبوعي المستخرج من البرنامج المعتمد -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="font-bold text-slate-800 text-base">جدول الحصص الأسبوعي المعتمد</h2>
                </div>
                <span class="text-xs px-2.5 py-1 bg-indigo-50 text-indigo-700 font-bold rounded-lg border border-indigo-100">مستخرج من البرنامج النهائي</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-100 text-slate-600 text-xs font-bold border-b border-slate-200">
                        <tr>
                            <th class="p-3.5 border">اليوم / الحصة</th>
                            <th class="p-3.5 border text-center">الأولى</th>
                            <th class="p-3.5 border text-center">الثانية</th>
                            <th class="p-3.5 border text-center">الثالثة</th>
                            <th class="p-3.5 border text-center">الرابعة</th>
                            <th class="p-3.5 border text-center">الخامسة</th>
                            <th class="p-3.5 border text-center">السادسة</th>
                            <th class="p-3.5 border text-center">السابعة</th>
                        </tr>
                    </thead>
                    <tbody id="teacherWeeklyScheduleBody" class="divide-y divide-slate-100 text-slate-700 font-medium text-xs">
                        <!-- يتم تعبئة الجدول برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- قسم الدورات والشهادات والبيانات الشخصية -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- إدارة الدورات والشهادات -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i data-lucide="award" class="w-5 h-5 text-indigo-600"></i>
                    <h3 class="font-bold text-slate-800 text-sm">دوراتي وشهاداتي المعتمدة</h3>
                </div>
                <div id="certificatesContainer" class="flex flex-wrap gap-2">
                    <!-- يتم
