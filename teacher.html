<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - البوابة المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-950 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500/20 rounded-xl flex items-center justify-center border border-yellow-500/30">
                    <i data-lucide="graduation-cap" class="w-6 h-6 text-yellow-400"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black" id="headerTeacherName">جارٍ التحميل...</h1>
                    <p class="text-xs text-slate-300" id="headerTeacherRole">معلم المادة</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="add-certificates.html" class="bg-indigo-900 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="award" class="w-4 h-4 text-yellow-400"></i> إضافة دورات وشهادات
                </a>
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-red-500/20">
                    <i data-lucide="log-out" class="w-4 h-4"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        <!-- معلومات المعلم الأكاديمية والخبرة -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">التخصص الأكاديمي</p>
                <p class="text-sm font-bold text-indigo-950 mt-1" id="profileMajor">-</p>
            </div>
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">سنة التخرج والخبرة</p>
                <p class="text-sm font-bold text-indigo-950 mt-1"><span id="profileGraduation">-</span> (خبرة: <span id="profileExperience">-</span>)</p>
            </div>
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">النصاب التدريبي والحصص</p>
                <p class="text-sm font-bold text-indigo-950 mt-1"><span id="profileQuota">-</span> حصة (<span id="profileClassesCount">-</span> صفوف)</p>
            </div>
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs text-slate-500 font-medium">رقم الهاتف</p>
                <p class="text-sm font-bold text-indigo-950 mt-1" id="profilePhone">-</p>
            </div>
        </div>

        <!-- الدورات والشهادات المضافة -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200">
            <h2 class="text-sm font-bold text-indigo-950 mb-3 flex items-center gap-2">
                <i data-lucide="medal" class="w-4 h-4 text-yellow-500"></i> الدورات والشهادات المعتمدة للحساب
            </h2>
            <div id="certificatesContainer" class="flex flex-wrap gap-2">
                <!-- تعبئة الدورات برمجياً -->
            </div>
        </div>

        <!-- جدول البرنامج الأسبوعي -->
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200">
            <h2 class="text-lg font-black text-indigo-950 mb-4">البرنامج الأسبوعي وجدول الحصص</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-sm">
                    <thead>
                        <tr class="bg-indigo-950 text-white text-xs">
                            <th class="p-3.5 rounded-r-xl">اليوم</th>
                            <th class="p-3.5">الحصة 1</th>
                            <th class="p-3.5">الحصة 2</th>
                            <th class="p-3.5">الحصة 3</th>
                            <th class="p-3.5">الحصة 4</th>
                            <th class="p-3.5">الحصة 5</th>
                            <th class="p-3.5">الحصة 6</th>
                            <th class="p-3.5 rounded-l-xl">الحصة 7</th>
                        </tr>
                    </thead>
                    <tbody id="teacherWeeklyScheduleBody" class="divide-y divide-slate-100 text-slate-700 font-medium text-xs">
                        <!-- الجدول الأسبوعي -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', loadTeacherDashboardData);
    </script>
</body>
</html>
