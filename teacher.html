<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم | النظام المدرسي المتكامل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- رأس الصفحة (Header) -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-800 border border-indigo-700 flex items-center justify-center shadow-inner">
                    <i data-lucide="graduation-cap" class="w-6 h-6 text-indigo-300"></i>
                </div>
                <div>
                    <!-- تم إعطاء هذا العنصر ID لضبط اسم المعلم تلقائياً -->
                    <h1 class="text-base font-bold leading-tight" id="headerTeacherName">جاري التحميل...</h1>
                    <span class="text-xs text-indigo-300 font-medium" id="headerTeacherRole">معلم المادة</span>
                </div>
            </div>
            <button onclick="logout()" class="flex items-center gap-2 px-3.5 py-2 bg-red-600/20 hover:bg-red-600 text-red-200 hover:text-white rounded-xl text-xs font-bold transition border border-red-500/30">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                تسجيل الخروج
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي (شبكي متكامل) -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- العمود الجانبي للبطاقات الإحصائية والملف الوظيفي -->
        <div class="lg:col-span-4 space-y-6">
            
            <!-- بطاقات الملخص والإحصاءات (شبكية مصغرة) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold shrink-0">
                        <i data-lucide="book-open" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-semibold">المبحث / التخصص</span>
                        <span class="text-xs font-bold text-slate-800" id="profileSubject">-</span>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold shrink-0">
                        <i data-lucide="award" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-semibold">المؤهل الأكاديمي</span>
                        <span class="text-xs font-bold text-slate-800" id="profileMajor">-</span>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold shrink-0">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-semibold">نصاب الحصص</span>
                        <span class="text-xs font-bold text-slate-800" id="profileQuota">-</span>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold shrink-0">
                        <i data-lucide="users" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-400 block font-semibold">الصفوف المسندة</span>
                        <span class="text-xs font-bold text-slate-800" id="profileClassesCount">-</span>
                    </div>
                </div>
            </div>

            <!-- الملف الوظيفي والخبرات -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i data-lucide="user-check" class="w-5 h-5 text-indigo-600"></i>
                    <h3 class="font-bold text-slate-800 text-sm">الملف الوظيفي والخبرات</h3>
                </div>
                <div class="space-y-2.5 text-xs text-slate-600 font-medium">
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-slate-400">سنوات الخبرة:</span>
                        <span id="profileExperience" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-slate-400">سنة التخرج:</span>
                        <span id="profileGraduation" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-slate-400">رقم الهاتف:</span>
                        <span id="profilePhone" class="font-bold text-slate-800">-</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- العمود الرئيسي لعرض جدول الحصص الأسبوعي -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="calendar"
