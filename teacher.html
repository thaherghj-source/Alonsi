<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلم الإلكترونية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <nav class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <i data-lucide="book-open" class="text-yellow-400 w-6 h-6"></i>
            <span class="font-bold text-lg">بوابة المعلم - لوحة التحكم الشخصية</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="teacherWelcomeName" class="text-xs text-yellow-300 bg-indigo-950 px-3 py-1.5 rounded-lg"></span>
            <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">تسجيل خروج</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <!-- بطاقة الترحيب -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <h1 id="teacherTitleName" class="text-2xl font-black text-indigo-950 mb-1">أهلاً بك، أستاذ</h1>
                <p class="text-slate-500 text-sm">متابعة حصيدك اليومي وجداول الأشغال والتعويضات الخاصة بك.</p>
            </div>
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-indigo-900 font-bold text-sm">
                المادة الأساسية: <span id="teacherSubjectText" class="text-indigo-600">رياضيات</span>
            </div>
        </div>

        <!-- جدول الحصص والأشغال الخاصة بالمعلم -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-indigo-950 mb-4 flex items-center gap-2">
                <i data-lucide="calendar"></i> جدول الحصص وحصص الأشغال المسندة إليك
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700">
                            <th class="p-3 border">اليوم / الحصة</th>
                            <th class="p-3 border">الصف والشعبة</th>
                            <th class="p-3 border">نوع الحصة (أساسية / تعويضية)</th>
                            <th class="p-3 border">الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="teacherScheduleTable">
                        <tr>
                            <td class="p-3 border">الحصة الثالثة</td>
                            <td class="p-3 border">العاشر - أ</td>
                            <td class="p-3 border font-semibold text-emerald-700">حصة تعويضية (شغل)</td>
                            <td class="p-3 border"><span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-bold">مؤكدة</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('currentUserSession') || '{}');
            if(session.name) {
                document.getElementById('teacherWelcomeName').textContent = session.name;
                document.getElementById('teacherTitleName').textContent = `أهلاً بك، أ. ${session.name}`;
            }
        });
    </script>
</body>
</html>
