<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة الدورات والشهادات - البوابة المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-yellow-500/20 text-yellow-600 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-yellow-500/30">
                <i data-lucide="award" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-black text-indigo-950">إضافة دورة أو شهادة جديدة</h1>
            <p class="text-xs text-slate-500 mt-1">تحديث سجلك المهني والتدريبي في النظام</p>
        </div>

        <form onsubmit="handleAddCertificate(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم الدورة أو الشهادة التدريبية</label>
                <input type="text" id="newCertificateInput" required placeholder="مثال: دورة القيادة التربوية المتقدمة..." class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-indigo-600 font-semibold">
            </div>

            <button type="submit" class="w-full bg-indigo-950 hover:bg-indigo-900 text-white py-3.5 rounded-xl font-bold transition shadow-md text-sm cursor-pointer">
                حفظ وإضافة للقائمة
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="teacher.html" class="text-xs text-indigo-600 font-bold hover:underline inline-flex items-center gap-1">
                <i data-lucide="arrow-right" class="w-3 h-3"></i> العودة لوحة التحكم
            </a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
