<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعادة ضبط النظام وحذف كافة البيانات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center space-y-4 border border-slate-700">
        <div class="w-16 h-16 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">⚠️</div>
        <h1 class="text-xl font-bold">إعادة ضبط النظام بالكامل</h1>
        <p class="text-slate-400 text-xs leading-relaxed">
            سيؤدي هذا الإجراء إلى حذف كافة المستخدمين، المعلمين، البيانات المخزنة، وجداول الحصص نهائياً من ذاكرة المتصفح (localStorage) للبدء من جديد.
        </p>
        <button onclick="resetAllData()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-xs transition shadow-lg">
            تنفيذ الحذف الشامل والبدء من جديد
        </button>
        <div id="statusMsg" class="text-xs font-bold text-emerald-400 hidden">تم حذف كافة البيانات وإعادة تعيين النظام بنجاح!</div>
    </div>

    <script>
        function resetAllData() {
            if (confirm('هل أنت متأكد تماماً من رغبتك في حذف جميع المستخدمين والبيانات والبدء من جديد؟')) {
                // مسح كافة البيانات المخزنة في المتصفح للمشروع
                localStorage.clear();
                sessionStorage.clear();
                
                // إظهار رسالة النجاح
                const msg = document.getElementById('statusMsg');
                if (msg) msg.classList.remove('hidden');
                
                setTimeout(() => {
                    alert('تمت عملية التهيئة وحذف كافة البيانات بنجاح. يمكنك الآن تشغيل مشروعك كأنه جديد تماماً، ولا تنسَ حذف هذا الملف.');
                    // الانتقال لصفحة تسجيل الدخول أو الرئيسية إن وجدت
                    window.location.href = 'index.html';
                }, 1000);
            }
        }
    </script>
</body>
</html>
