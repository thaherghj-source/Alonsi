<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة العليا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <nav class="bg-indigo-950 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <i data-lucide="shield-check" class="text-yellow-400 w-6 h-6"></i>
            <span class="font-bold text-lg">لوحة الإدارة العليا (المدير والمساعد والإداريون)</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="adminNameDisplay" class="text-xs text-yellow-300 bg-indigo-900 px-3 py-1.5 rounded-lg"></span>
            <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">خروج</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 space-y-8">
        
        <!-- إدارة شريط الأخبار العاجلة -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-indigo-950 mb-4 flex items-center gap-2">
                <i data-lucide="radio" class="text-red-600"></i> إرسال تنبيه أو أخبار عاجلة (تظهر لجميع الزوار والطلاب)
            </h2>
            <div class="flex gap-3">
                <input type="text" id="newsInput" placeholder="أدخل التعليمات أو الأخبار الجديدة هنا..." class="flex-1 p-3 border rounded-xl focus:outline-indigo-600 bg-slate-50">
                <button onclick="updateNewsTicker()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition shadow-md">
                    <i data-lucide="send" class="w-4 h-4"></i> نشر فوري
                </button>
            </div>
        </section>

        <!-- برنامج الأشغال اليومي الذكي -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-indigo-950 mb-4 flex items-center gap-2">
                <i data-lucide="cpu" class="text-indigo-600"></i> نظام تعويض الحصص والأشغال اليومي الذكي
            </h2>
            
            <div class="grid md:grid-cols-3 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border">
                <div>
                    <label class="block text-sm font-semibold mb-1">الصف والشعبة</label>
                    <select id="subClassSelect" class="w-full p-2.5 border rounded-lg bg-white">
                        <option value="العاشر-أ">العاشر - أ</option>
                        <option value="العاشر-ب">العاشر - ب</option>
                        <option value="الحادي عشر-أ">الحادي عشر - أ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">الحصة المطلوب تعويضها</label>
                    <select id="subPeriodSelect" class="w-full p-2.5 border rounded-lg bg-white">
                        <option value="1">الحصة الأولى</option>
                        <option value="2">الحصة الثانية</option>
                        <option value="3">الحصة الثالثة</option>
                        <option value="6">الحصة السادسة</option>
                        <option value="7">الحصة السابعة</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="findSubstitutes()" class="w-full bg-indigo-900 hover:bg-indigo-950 text-white py-2.5 rounded-lg font-bold transition">
                        استعراض البدلاء المقترحين
                    </button>
                </div>
            </div>

            <!-- نتائج التعويض -->
            <div id="substitutionResults" class="hidden space-y-4">
                <h3 class="font-bold text-slate-700">الخيارات والخيارات المتاحة للتعويض:</h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="border p-4 rounded-xl bg-emerald-50/60 border-emerald-200">
                        <h4 class="font-bold text-emerald-900 mb-2">1. المعلمون المتفرغون (يدرسون نفس الصف):</h4>
                        <div id="classTeachersList" class="space-y-2 text-sm">
