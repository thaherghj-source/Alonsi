<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل الشامل - البوابة المدرسية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-xl w-full rounded-3xl shadow-2xl overflow-hidden my-6 border border-white/20">
        <!-- رأس الصفحة -->
        <div class="bg-indigo-950 text-white p-6 text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-yellow-500/10 rounded-full blur-2xl"></div>
            <div class="relative z-10">
                <div class="w-14 h-14 bg-yellow-500/20 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-yellow-500/30">
                    <i data-lucide="user-plus" class="w-8 h-8 text-yellow-400"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wide">التسجيل في البوابة المدرسية</h1>
                <p class="text-xs text-slate-300 mt-1">أدخل بياناتك للتحقق التلقائي والربط مع قاعدة البيانات</p>
            </div>
        </div>

        <div class="p-8">
            <!-- صندوق التنبيهات -->
            <div id="regAlert" class="hidden mb-5 p-3.5 rounded-xl text-sm text-center font-bold shadow-sm transition-all"></div>

            <form onsubmit="handleRegistrationSubmit(event)" class="space-y-5">
                
                <!-- نوع الحساب / الفئة -->
                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-1.5 flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i> نوع الحساب
                    </label>
                    <select id="userRoleCategory" onchange="toggleRegistrationRole()" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-indigo-950 focus:ring-2 focus:ring-indigo-600 outline-none">
                        <option value="staff">الكادر المدرسي (إدارة / معلمون / إداريون)</option>
                        <option value="student">طالب / ولي أمر</option>
                    </select>
                </div>

                <!-- 1. قسم الكادر المدرسي (الرقم الوزاري مع البحث التلقائي) -->
                <div id="staffRegistrationGroup" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-4 h-4 text-amber-600"></i> الرقم الوزاري المعتمد
                        </label>
                        <div class="flex gap-2">
                            <input type="text" id="ministryIdInput" placeholder="أدخل رقمك الوزاري (مثال: 146193)..." class="flex-1 p-3 border border-slate-300 rounded-xl bg-slate-50 font-bold text-indigo-950 focus:ring-2 focus:ring-indigo-600 outline-none">
                            <button type="button" onclick="lookupStaffByMinistryId()" class="bg-indigo-900 hover:bg-indigo-950 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-1.5 transition shadow-md cursor-pointer">
                                <i data-lucide="search" class="w-4 h-4 text-yellow-400"></i> تحقق
                            </button>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-1">بمجرد إدخال الرقم الصحيح والضغط على تحقق، سيتم جلب بياناتك وسجل تخصصه ومادتك تلقائياً.</p>
                    </div>

                    <!-- بطاقة المعلومات المستخرجة تلقائياً للكادر -->
                    <div id="staffInfoCard" class="hidden p-4 rounded-2xl bg-indigo-50/70 border border-indigo-100 space-y-2 text-sm">
                        <p class="font-bold text-indigo-950">الاسم الكامل: <span id="resFullName" class="font-normal text-slate-800"></span></p>
                        <p class="font-bold text-indigo-950">المسمى الوظيفي: <span id="resRole" class="font-normal text-emerald-700"></span></p>
                        <p class="font-bold text-indigo-950">التخصص الأكاديمي: <span id="resMajor" class="font-normal text-slate-800"></span></p>
                        <p class="font-bold text-indigo-950">المادة الدراسية: <span id="resSubject" class="font-normal text-slate-800"></span></p>
                        <p class="font-bold text-indigo-950">الصفوف المسندة: <span id
