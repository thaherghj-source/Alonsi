<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم أمين العهدة - البوابة المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">
    <header class="bg-indigo-950 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500/20 rounded-xl flex items-center justify-center border border-yellow-500/30">
                    <i data-lucide="boxes" class="w-6 h-6 text-yellow-400"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black" id="userNameDisplay">أمين العهدة</h1>
                    <p class="text-xs text-slate-300" id="userRoleDisplay">إدارة المستودعات والعهد المدرسية</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-500/10 text-red-400 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-red-500/20">
                <i data-lucide="log-out" class="w-4 h-4"></i> خروج
            </button>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center">
            <h2 class="text-2xl font-black text-indigo-950 mb-2">لوحة تحكم أمين العهدة</h2>
            <p class="text-sm text-slate-500">سجل عهدة المدرسة، الكتب، والأجهزة والمختبرات.</p>
        </div>
    </main>
    <script src="js/main.js"></script>
    <script>lucide.createIcons(); document.addEventListener('DOMContentLoaded', loadGenericDashboard);</script>
</body>
</html>
