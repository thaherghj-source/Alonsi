<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير والمساعد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-950 text-white p-6 text-center">
            <i data-lucide="shield-check" class="w-12 h-12 mx-auto mb-2 text-yellow-400"></i>
            <h1 class="text-xl font-bold">لوحة تحكم الإدارة العليا</h1>
            <p class="text-xs text-yellow-200 mt-1">مخصصة فقط لـ (المدير / مساعد المدير)</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b text-center font-bold bg-slate-50">
            <button id="adminLoginTab" onclick="switchAdminTab('login')" class="w-1/2 py-3 border-b-2 border-indigo-900 text-indigo-900">تسجيل الدخول</button>
            <button id="adminRegisterTab" onclick="switchAdminTab('register')" class="w-1/2 py-3 text-slate-500 hover:text-indigo-900">تفعيل/إنشاء حساب لأول مرة</button>
        </div>

        <div class="p-6">
            <!-- Alert Message -->
            <div id="adminAlert" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

            <!-- 1. نموذج تسجيل الدخول -->
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">الرقم الوزاري المعتمد</label>
                    <input type="text" id="loginMinistryId" required placeholder="أدخل الرقم الوزاري المخصص لك" class="w-full p-2.5 border rounded-lg focus:outline-indigo-900">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">كلمة السر</label>
                    <input type="password" id="loginPassword" required class="w-full p-2.5 border rounded-lg focus:outline-indigo-900">
                </div>
                <button type="submit" class="w-full bg-indigo-950 hover:bg-indigo-900 text-white py-2.5 rounded-lg font-bold transition">دخول لوحة الإدارة</button>
            </form>

            <!-- 2. نموذج تسجيل لأول مرة (التحقق بالرقم الوزاري) -->
            <form id="adminRegisterForm" onsubmit="handleAdminRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-1">الصفة / الصلاحية الإدارية</label>
                    <select id="regAdminRole" required class="w-full p-2.5 border rounded-lg bg-slate-50 font-bold text-indigo-900">
                        <option value="مدير المدرسة">مدير المدرسة</option>
                        <option value="مساعد المدير">مساعد المدير</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">الرقم الوزاري (يجب أن يكون بالقائمة المعتمدة)</label>
