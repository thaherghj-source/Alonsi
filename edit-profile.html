<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل بيانات الحساب - البوابة المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-900 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-indigo-200">
                <i data-lucide="user-pen" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-black text-indigo-950">تعديل اسم المستخدم وكلمة السر</h1>
            <p class="text-xs text-slate-500 mt-1">تحديث بيانات الدخول الخاصة بك في قاعدة البيانات</p>
        </div>

        <div id="editAlert" class="hidden mb-4 p-3 rounded-xl text-xs text-center font-bold"></div>

        <form onsubmit="handleProfileUpdate(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم الجديد (Username)</label>
                <input type="text" id="editUsername" required class="w-full p-3 border rounded-xl bg-slate-50 font-semibold text-sm outline-none focus:ring-2 focus:ring-indigo-600">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة السر الجديدة</label>
                <input type="password" id="editPassword" required placeholder="••••••••" class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-indigo-600">
            </div>

            <button type="submit" class="w-full bg-indigo-950 hover:bg-indigo-900 text-white py-3 rounded-xl font-bold transition shadow-md text-sm cursor-pointer">
                حفظ التعديلات
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="teacher.html" class="text-xs text-indigo-600 font-bold hover:underline inline-flex items-center gap-1">
                <i data-lucide="arrow-right" class="w-3 h-3"></i> العودة للوحة التحكم
            </a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('currentUserSession') || '{}');
            if (session.username) {
                document.getElementById('editUsername').value = session.username;
            }
        });
    </script>
</body>
</html>
